events { worker_connections 1024; }

http {
  server {
    listen 80;

    location = /ping {
      proxy_pass http://back-end:8080/ping;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://front-end:5001;
    }

    location /api/ {
      proxy_set_header Host $host;
      proxy_pass http://back-end:8080/;
    }
  }
}